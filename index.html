<!doctype html>
<html lang="sv">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>CB Type FX Tool</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto+Flex:opsz,wght,wdth@8..144,100..1000,25..151&family=Inter:wght@100..900&family=Space+Grotesk:wght@300..700&family=IBM+Plex+Mono:wght@200..700&family=Playfair+Display:wght@400..900&display=swap" rel="stylesheet">

  <style>
    :root{
      --h: 215;
      --uiA: .88;
      --uiBg: hsl(var(--h) 35% 11% / var(--uiA));
      --uiBd: hsl(var(--h) 35% 24% / .9);
      --uiTx: hsl(var(--h) 20% 92% / .95);
    }
    html,body{height:100%;margin:0;background:#0b0c10;color:#e9eef7;font:14px/1.2 system-ui}
    #ui{
      position:fixed;left:12px;top:12px;z-index:9;
      background:var(--uiBg);border:1px solid var(--uiBd);color:var(--uiTx);
      padding:10px 12px;border-radius:12px;backdrop-filter:blur(10px);
      width:300px
    }
    label{display:block;margin:8px 0 2px;opacity:.92}
    input,select,button{width:100%}
    .row{display:flex;gap:8px}
    .row>*{flex:1}
    small{opacity:.75;display:block;margin-top:6px}
    button{
      margin-top:8px;border:1px solid var(--uiBd);
      background:hsl(var(--h) 35% 16% / .9);color:var(--uiTx);
      padding:8px 10px;border-radius:10px;cursor:pointer
    }
    button:active{transform:translateY(1px)}
    #wrap{height:100%;display:grid;place-items:center;padding:56px 24px}
    #t{
      max-width:min(1100px,92vw);
      outline:none;
      white-space:pre-wrap;
      transform-origin:0 0;
     img_TEXTCOLOR
      will-change:transform,filter;
      font-size:64px;
      line-height:1.05;
      letter-spacing:-.02em;
      filter:url(#fx);
    }
  </style>
</head>

<body>
  <div id="ui">
    <div class="row">
      <div>
        <label>Font</label>
        <select id="font">
          <option value="Roboto Flex">Roboto Flex (variable)</option>
          <option value="Inter">Inter</option>
          <option value="Space Grotesk">Space Grotesk</option>
          <option value="IBM Plex Mono">IBM Plex Mono</option>
          <option value="Playfair Display">Playfair Display</option>
        </select>
      </div>
      <div>
        <label>Size</label>
        <input id="fs" type="range" min="18" max="180" value="64" />
      </div>
    </div>

    <div class="row">
      <div><label>Weight</label><input id="w" type="range" min="100" max="1000" value="450" /></div>
      <div><label>Stretch</label><input id="s" type="range" min="50" max="200" value="100" /></div>
    </div>

    <label>Distortion</label><input id="k" type="range" min="0" max="140" value="12" />
    <label>Blur</label><input id="b" type="range" min="0" max="24" value="0" />

    <div class="row">
      <div><label>3D amount</label><input id="a3" type="range" min="0" max="100" value="0" /></div>
      <div><label>Perspective</label><input id="p3" type="range" min="200" max="2000" value="900" /></div>
    </div>

    <div class="row">
      <div><label>UI hue</label><input id="hue" type="range" min="0" max="360" value="215" /></div>
      <div><label>Animation FPS</label><input id="fps" type="range" min="0" max="60" value="24" /></div>
    </div>

    <button id="dlpng">Download PNG (.png)</button>
    <button id="dljson">Download preset (.json)</button>
    <button id="dlhtml">Download snapshot (.html)</button>
    <small>Click text to edit. Settings autosave locally.</small>
  </div>

  <div id="wrap">
    <div id="t" contenteditable="true" spellcheck="false">Type something…
Edit me in real time.</div>
  </div>

  <!-- FX FILTER (distortion + blur in SVG) -->
  <svg width="0" height="0" style="position:absolute">
    <filter id="fx">
      <feTurbulence id="tb" type="fractalNoise" baseFrequency=".012" numOctaves="2" seed="2" result="noise"/>
      <feDisplacementMap id="dm" in="SourceGraphic" in2="noise" scale="12" xChannelSelector="R" yChannelSelector="G" result="displaced"/>
      <feGaussianBlur id="gb" in="displaced" stdDeviation="0"/>
    </filter>
  </svg>

  <script>
    const $ = (id) => document.getElementById(id);

    const t = $("t"),
      wrap = $("wrap"),
      font = $("font"), fs = $("fs"),
      w = $("w"), s = $("s"),
      k = $("k"), b = $("b"),
      a3 = $("a3"), p3 = $("p3"),
      hue = $("hue"), fps = $("fps");

    const dm = $("dm"), tb = $("tb"), gb = $("gb");

    let mx = 0, my = 0, seed = 2, last = 0, acc = 0;

    function setVarFont(){
      const isFlex = (font.value === "Roboto Flex");
      t.style.fontFamily = `"${font.value}", system-ui`;

      if(isFlex){
        t.style.fontVariationSettings = `"wght" ${w.value}, "wdth" ${s.value}`;
        t.style.fontWeight = 400;
      }else{
        t.style.fontVariationSettings = "normal";
        const mapped = Math.round((+w.value - 100) / 900 * 800 + 100);
        t.style.fontWeight = mapped;
      }
    }

    function getState(){
      return {
        text: t.textContent,
        font: font.value,
        fs: +fs.value,
        w: +w.value,
        s: +s.value,
        k: +k.value,
        b: +b.value,
        a3: +a3.value,
        p3: +p3.value,
        hue: +hue.value,
        fps: +fps.value
      };
    }

    function saveLocal(){
      localStorage.setItem("typefx_state_v3", JSON.stringify(getState()));
    }

    function loadLocal(){
      try{
        const raw = localStorage.getItem("typefx_state_v3");
        if(!raw) return;
        const st = JSON.parse(raw);

        t.textContent = st.text ?? t.textContent;
        font.value = st.font ?? font.value;
        fs.value = st.fs ?? fs.value;
        w.value = st.w ?? w.value;
        s.value = st.s ?? s.value;
        k.value = st.k ?? k.value;
        b.value = st.b ?? b.value;
        a3.value = st.a3 ?? a3.value;
        p3.value = st.p3 ?? p3.value;
        hue.value = st.hue ?? hue.value;
        fps.value = st.fps ?? fps.value;
      }catch(e){}
    }

    function upd(){
      document.documentElement.style.setProperty("--h", hue.value);

      t.style.fontSize = fs.value + "px";
      setVarFont();

      dm.setAttribute("scale", k.value);
      tb.setAttribute("baseFrequency", (0.006 + (+k.value) * 0.00018).toFixed(4));
      gb.setAttribute("stdDeviation", (+b.value).toFixed(2));

      const stretch = (+s.value) / 100;
      const persp = +p3.value;
      const amt = (+a3.value) / 100;
      const rx = (-my * amt * 18).toFixed(3);
      const ry = ( mx * amt * 22).toFixed(3);

      t.style.transform = `perspective(${persp}px) rotateX(${rx}deg) rotateY(${ry}deg) scaleX(${stretch})`;

      saveLocal();
    }

    function download(name, mime, content){
      const a = document.createElement("a");
      a.href = URL.createObjectURL(new Blob([content], { type: mime }));
      a.download = name;
      a.click();
      setTimeout(() => URL.revokeObjectURL(a.href), 500);
    }

    function escHtml(s){
      return String(s)
        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;");
    }

    async function downloadPNG(){
      upd(); // make sure latest values are applied

      const st = getState();
      const bg = getComputedStyle(document.body).backgroundColor || "#0b0c10";

      // Build an SVG that recreates ONLY the centered text area (no menu).
      // Using foreignObject lets the browser render the same CSS + SVG filter.
      const svgW = Math.max(1, Math.floor(innerWidth));
      const svgH = Math.max(1, Math.floor(innerHeight));

      const tCS = getComputedStyle(t);
      const wrapCS = getComputedStyle(wrap);

      const css = `
        html,body{margin:0;height:100%;background:${bg}}
        #wrap{
          height:100%;
          display:${wrapCS.display};
          place-items:${wrapCS.placeItems};
          padding:${wrapCS.padding};
        }
        #t{
          max-width:${tCS.maxWidth};
          white-space:pre-wrap;
          font-family:${tCS.fontFamily};
          font-size:${tCS.fontSize};
          line-height:${tCS.lineHeight};
          letter-spacing:${tCS.letterSpacing};
          color:${tCS.color};
          filter:url(#fx);
          transform-origin:${tCS.transformOrigin};
          transform:${tCS.transform};
          font-variation-settings:${tCS.fontVariationSettings};
          font-weight:${tCS.fontWeight};
          -webkit-text-size-adjust:100%;
        }`;

      const xhtml = `
        <div xmlns="http://www.w3.org/1999/xhtml">
          <style>${css}</style>
          <div id="wrap"><div id="t">${escHtml(st.text)}</div></div>
        </div>`;

      const svg = `
        <svg xmlns="http://www.w3.org/2000/svg" width="${svgW}" height="${svgH}">
          <defs>
            <filter id="fx">
              <feTurbulence type="fractalNoise" baseFrequency="${(0.006 + st.k*0.00018).toFixed(4)}" numOctaves="2" seed="2" result="noise"/>
              <feDisplacementMap in="SourceGraphic" in2="noise" scale="${st.k}" xChannelSelector="R" yChannelSelector="G" result="displaced"/>
              <feGaussianBlur in="displaced" stdDeviation="${(+st.b).toFixed(2)}"/>
            </filter>
          </defs>
          <rect width="100%" height="100%" fill="${bg}"/>
          <foreignObject x="0" y="0" width="100%" height="100%">${xhtml}</foreignObject>
        </svg>`;

      const svgBlob = new Blob([svg], { type: "image/svg+xml;charset=utf-8" });
      const url = URL.createObjectURL(svgBlob);

      try{
        const img = new Image();
        img.decoding = "async";
        img.src = url;

        await new Promise((res, rej) => {
          img.onload = () => res();
          img.onerror = () => rej(new Error("PNG export failed to load SVG image."));
        });

        const dpr = devicePixelRatio || 1;
        const canvas = document.createElement("canvas");
        canvas.width = Math.round(svgW * dpr);
        canvas.height = Math.round(svgH * dpr);
        const ctx = canvas.getContext("2d");

        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        ctx.drawImage(img, 0, 0, svgW, svgH);

        const blob = await new Promise((res) => canvas.toBlob(res, "image/png"));
        if(!blob) throw new Error("PNG export failed to create blob.");

        const a = document.createElement("a");
        a.href = URL.createObjectURL(blob);
        a.download = "typefx.png";
        a.click();
        setTimeout(() => URL.revokeObjectURL(a.href), 500);
      } finally {
        URL.revokeObjectURL(url);
      }
    }

    function tick(ts){
      const target = +fps.value;

      if(target <= 0){
        last = ts;
        requestAnimationFrame(tick);
        return;
      }

      const dt = ts - last;
      last = ts;
      acc += dt;

      const step = 1000 / target;

      while(acc >= step){
        seed = (seed + 1) % 9999;
        tb.setAttribute("seed", seed);
        acc -= step;
      }

      requestAnimationFrame(tick);
    }

    addEventListener("mousemove", (e) => {
      mx = (e.clientX / innerWidth - .5) * 2;
      my = (e.clientY / innerHeight - .5) * 2;
      if(+a3.value > 0) upd();
    }, { passive:true });

    [font, fs, w, s, k, b, a3, p3, hue, fps].forEach(el => {
      el.addEventListener("input", upd);
    });

    t.addEventListener("input", upd);

    $("dlpng").addEventListener("click", () => {
      downloadPNG().catch(err => alert(err.message));
    });

    $("dljson").addEventListener("click", () => {
      download("typefx-preset.json", "application/json", JSON.stringify(getState(), null, 2));
    });

    $("dlhtml").addEventListener("click", () => {
      const st = getState();
      const html = `<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Type FX Snapshot</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto+Flex:opsz,wght,wdth@8..144,100..1000,25..151&family=Inter:wght@100..900&family=Space+Grotesk:wght@300..700&family=IBM+Plex+Mono:wght@200..700&family=Playfair+Display:wght@400..900&display=swap" rel="stylesheet">
<style>
  html,body{height:100%;margin:0;display:grid;place-items:center;background:#0b0c10;color:#e9eef7}
  #t{max-width:min(1100px,92vw);white-space:pre-wrap;transform-origin:0 0;
     font-family:"${st.font}",system-ui;font-size:${st.fs}px;line-height:1.05;letter-spacing:-.02em;
     font-variation-settings:${st.font==="Roboto Flex" ? `"wght" ${st.w}, "wdth" ${st.s}` : "normal"};
     font-weight:${st.font==="Roboto Flex" ? 400 : Math.round((st.w-100)/900*800+100)};
     filter:url(#fx);
     transform:perspective(${st.p3}px) rotateX(0deg) rotateY(0deg) scaleX(${st.s/100});}
</style>
<div id="t">${escHtml(st.text)}</div>
<svg width="0" height="0" style="position:absolute">
  <filter id="fx">
    <feTurbulence type="fractalNoise" baseFrequency="${(0.006 + st.k*0.00018).toFixed(4)}" numOctaves="2" seed="2" result="noise"/>
    <feDisplacementMap in="SourceGraphic" in2="noise" scale="${st.k}" xChannelSelector="R" yChannelSelector="G" result="displaced"/>
    <feGaussianBlur in="displaced" stdDeviation="${(+st.b).toFixed(2)}"/>
  </filter>
</svg>`;
      download("typefx-snapshot.html", "text/html", html);
    });

    loadLocal();
    upd();
    requestAnimationFrame(tick);
  </script>
</body>
</html>
