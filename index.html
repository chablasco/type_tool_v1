<!doctype html><meta charset="utf-8">
<title>CB Type Tool v1</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto+Flex:opsz,wght,wdth@8..144,100..1000,25..151&display=swap" rel="stylesheet">
<style>
  html,body{height:100%;margin:0;background:#0b0c10;color:#e9eef7;font:14px/1.2 system-ui}
  #ui{position:fixed;left:12px;top:12px;z-index:9;background:#111726cc;border:1px solid #283046;
      padding:10px 12px;border-radius:12px;backdrop-filter:blur(8px);width:260px}
  label{display:block;margin:8px 0 2px;opacity:.9} input{width:100%} .row{display:flex;gap:8px}
  .row>div{flex:1} small{opacity:.7}
  #wrap{height:100%;display:grid;place-items:center;padding:56px 24px}
  #t{max-width:min(1100px,92vw);outline:none;white-space:pre-wrap;
     font-family:"Roboto Flex",system-ui;font-size:64px;line-height:1.05;letter-spacing:-.02em;
     filter:url(#d);transform-origin:0 0}
</style>

<div id="ui">
  <div class="row">
    <div><label>Weight</label><input id="w" type="range" min="100" max="1000" value="450"></div>
    <div><label>Stretch</label><input id="s" type="range" min="50" max="200" value="100"></div>
  </div>
  <label>Distortion</label><input id="k" type="range" min="0" max="80" value="12">
  <small>Edit text below. Changes update in real time.</small>
</div>

<div id="wrap">
  <div id="t" contenteditable="true" spellcheck="false">Type something…
Change me in real time.</div>
</div>

<svg width="0" height="0" style="position:absolute">
  <filter id="d">
    <feTurbulence id="tb" type="fractalNoise" baseFrequency=".012" numOctaves="2" seed="2"/>
    <feDisplacementMap id="dm" in="SourceGraphic" scale="12"/>
  </filter>
</svg>

<script>
  const t=document.getElementById('t'),w=document.getElementById('w'),
        s=document.getElementById('s'),k=document.getElementById('k'),
        dm=document.getElementById('dm'),tb=document.getElementById('tb');
  function upd(){
    t.style.fontVariationSettings=`"wght" ${w.value},"wdth" ${s.value}`;
    t.style.transform=`scaleX(${(+s.value)/100})`;
    dm.setAttribute('scale',k.value);
    tb.setAttribute('baseFrequency',(0.006+(+k.value)*0.00018).toFixed(4));
  }
  [w,s,k].forEach(el=>el.addEventListener('input',upd)); upd();
</script>
